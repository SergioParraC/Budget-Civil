<div class="proyecto-list">
  <div class="proyecto-list__header">
    <h2>Proyectos</h2>
    @if (canCreate) {
      <a routerLink="/proyectos/nuevo">
        <p-button label="Nuevo proyecto" icon="pi pi-plus" />
      </a>
    }
  </div>

  <p-table
    [value]="projects()"
    [lazy]="true"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 50, 100]"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    (onLazyLoad)="load($event)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Estado</th>
        <th>Visibilidad</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-project>
      <tr>
        <td>{{ project.name }}</td>
        <td><p-tag [value]="project.status" [severity]="statusSeverity(project.status)" /></td>
        <td>{{ project.isPublic ? 'Público' : 'Privado' }}</td>
        <td>
          <a [routerLink]="['/proyectos', project.projectId]">
            <p-button icon="pi pi-eye" [text]="true" />
          </a>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
