<p-card header="Nuevo proyecto">
  @if (!currentUser()?.companyId) {
    <p-message
      severity="warn"
      text="Tu usuario no tiene una compañía asignada. Asígnala antes de crear el proyecto; si ya la tienes, cierra sesión y vuelve a entrar."
    />
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
    <label for="name">Nombre</label>
    <input id="name" pInputText formControlName="name" maxlength="255" />

    <label for="description">Descripción</label>
    <textarea id="description" pTextarea formControlName="description" rows="2" maxlength="1000"></textarea>

    <label for="objective">Objetivo</label>
    <textarea id="objective" pTextarea formControlName="objective" rows="2" maxlength="1000"></textarea>

    <label for="country">País</label>
    <p-select
      id="country"
      formControlName="countryId"
      [options]="countries()"
      optionLabel="name"
      optionValue="id"
      (onChange)="onCountryChange($event.value)"
    />

    <label for="department">Departamento</label>
    <p-select
      id="department"
      formControlName="departmentId"
      [options]="departments()"
      optionLabel="name"
      optionValue="id"
      (onChange)="onDepartmentChange($event.value)"
    />

    <label for="municipality">Municipio</label>
    <p-select id="municipality" formControlName="municipalityId" [options]="municipalities()" optionLabel="name" optionValue="id" />

    <label for="currency">Divisa</label>
    <p-select id="currency" formControlName="baseCurrencyId" [options]="currencies()" optionLabel="isoCode" optionValue="id" />

    <label for="budgetLimit">Tope presupuestal (opcional)</label>
    <p-inputnumber id="budgetLimit" formControlName="budgetLimit" [min]="0" placeholder="Sin tope" />

    <label for="signingMode">Modo de firma</label>
    <p-select id="signingMode" formControlName="signingMode" [options]="signingModes" optionLabel="label" optionValue="value" />

    <div class="form-grid__switch">
      <label for="requiresAuditor">Requiere auditor</label>
      <p-toggleswitch id="requiresAuditor" formControlName="requiresAuditor" />
    </div>

    <label>AIU (%)</label>
    <small class="form-grid__aiu-hint">
      AIU = Administración, Imprevistos y Utilidad. Cada porcentaje admite hasta 1 decimal.
    </small>
    <div class="form-grid__aiu">
      <div class="form-grid__aiu-field">
        <label for="adminPercent">Administración (A)</label>
        <p-inputnumber
          inputId="adminPercent"
          formControlName="adminPercent"
          suffix="%"
          placeholder="0"
          [min]="0"
          [max]="100"
          [minFractionDigits]="0"
          [maxFractionDigits]="1"
          [step]="0.1"
          (onBlur)="normalizeAiu('adminPercent')"
        />
        <small class="form-grid__aiu-hint">Costos de administración de la obra.</small>
      </div>

      <div class="form-grid__aiu-field">
        <label for="unforeseenPercent">Imprevistos (I)</label>
        <p-inputnumber
          inputId="unforeseenPercent"
          formControlName="unforeseenPercent"
          suffix="%"
          placeholder="0"
          [min]="0"
          [max]="100"
          [minFractionDigits]="0"
          [maxFractionDigits]="1"
          [step]="0.1"
          (onBlur)="normalizeAiu('unforeseenPercent')"
        />
        <small class="form-grid__aiu-hint">Reserva para imprevistos de la obra.</small>
      </div>

      <div class="form-grid__aiu-field">
        <label for="profitPercent">Utilidad (U)</label>
        <p-inputnumber
          inputId="profitPercent"
          formControlName="profitPercent"
          suffix="%"
          placeholder="0"
          [min]="0"
          [max]="100"
          [minFractionDigits]="0"
          [maxFractionDigits]="1"
          [step]="0.1"
          (onBlur)="normalizeAiu('profitPercent')"
        />
        <small class="form-grid__aiu-hint">Ganancia esperada del proyecto.</small>
      </div>
    </div>

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" />
    }

    <p-button type="submit" label="Guardar" [loading]="saving()" />
  </form>
</p-card>
