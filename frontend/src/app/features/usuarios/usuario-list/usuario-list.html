<div class="usuario-list">
  <h2>Usuarios</h2>

  <p-table
    [value]="users()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 50, 100]"
    [loading]="loading()"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Usuario</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.primer_nombre }} {{ user.primer_apellido }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role_code }}</td>
        <td><p-tag [value]="user.estado_cuenta ? 'Activo' : 'Inactivo'" [severity]="user.estado_cuenta ? 'success' : 'danger'" /></td>
        <td class="usuario-list__actions">
          <p-button icon="pi pi-id-card" [text]="true" (onClick)="openRoleDialog(user)" />
          <p-button icon="pi pi-building" [text]="true" (onClick)="openCompanyDialog(user)" />
          <p-button icon="pi pi-ban" [text]="true" severity="danger" (onClick)="deactivate(user)" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="roleDialogVisible" [modal]="true" [style]="{ width: '360px' }" header="Cambiar rol">
  <form [formGroup]="roleForm" (ngSubmit)="submitRole()" class="form-grid">
    <p-select formControlName="rol_asignado" [options]="roleOptions" optionLabel="label" optionValue="value" />
    <p-button type="submit" label="Guardar" />
  </form>
</p-dialog>

<p-dialog [(visible)]="companyDialogVisible" [modal]="true" [style]="{ width: '360px' }" header="Cambiar compañía">
  <form [formGroup]="companyForm" (ngSubmit)="submitCompany()" class="form-grid">
    <p-select formControlName="company_id" [options]="companies()" optionLabel="business_name" optionValue="company_id" [filter]="true" filterBy="business_name" />
    <p-button type="submit" label="Guardar" />
  </form>
</p-dialog>
